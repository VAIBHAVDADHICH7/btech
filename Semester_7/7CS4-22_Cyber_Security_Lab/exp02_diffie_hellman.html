<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Exp 2: Diffie-Hellman Key Exchange</title></head>
<body>
  <h2>Diffie-Hellman Key Exchange (User = Alice, JS = Bob)</h2>
  <label>Prime p: <input id="p" type="number" value="23"></label>
  <label>Generator g: <input id="g" type="number" value="5"></label>
  <label>Alice Private Key (a): <input id="a" type="number" value="6"></label>
  <button onclick="exchange()">Compute Shared Secret</button>
  <pre id="out"></pre>
  <script>
    function modPow(base, exp, mod) {
      let res = 1n, b = BigInt(base) % BigInt(mod), e = BigInt(exp), m = BigInt(mod);
      while (e > 0n) { if (e & 1n) res = (res * b) % m; b = (b * b) % m; e >>= 1n; }
      return res;
    }
    function exchange() {
      const p = +document.getElementById('p').value;
      const g = +document.getElementById('g').value;
      const a = +document.getElementById('a').value;
      const b = 15; // Bob's private key
      const A = modPow(g, a, p);
      const B = modPow(g, b, p);
      const sAlice = modPow(B, a, p);
      const sBob = modPow(A, b, p);
      document.getElementById('out').textContent =
        `Alice Public A = ${A}\nBob Public B = ${B}\nAlice Shared Secret = ${sAlice}\nBob Shared Secret = ${sBob}`;
    }
  </script>
</body>
</html>
